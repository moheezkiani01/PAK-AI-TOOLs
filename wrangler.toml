name = "pak-ai-tools"
main = "worker.js"
compatibility_date = "2024-11-01"

# Main domain + www (Cloudflare creates DNS records and SSL automatically)
routes = [
  { pattern = "pakaitools.store", custom_domain = true },
  { pattern = "www.pakaitools.store", custom_domain = true }
]

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
