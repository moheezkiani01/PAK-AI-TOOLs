    <text x="160" y="47" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
      Live Quote
    </text>
  </g>

  <!-- Footer Info -->
  <text x="80" y="550" fill="#97a7a1" font-family="-apple-system, system-ui, sans-serif" font-size="20">
